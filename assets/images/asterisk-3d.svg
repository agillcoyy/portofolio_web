<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="armGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="armGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="facetHighlight" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#0369A1" flood-opacity="0.35"/>
    </filter>
  </defs>
  <circle cx="100" cy="100" r="85" fill="url(#starGlow)" opacity="0.6"/>
  <!-- 6-arm 3D Star / Asterisk -->
  <g filter="url(#softShadow)">
    <!-- Arm 1 (Top) -->
    <path d="M100 20 L115 85 L100 100 L85 85 Z" fill="url(#armGrad1)"/>
    <path d="M100 20 L115 85 L100 100 Z" fill="url(#facetHighlight)"/>
    
    <!-- Arm 2 (Bottom) -->
    <path d="M100 180 L85 115 L100 100 L115 115 Z" fill="url(#armGrad2)"/>
    <path d="M100 180 L85 115 L100 100 Z" fill="url(#facetHighlight)"/>
    
    <!-- Arm 3 (Top Right) -->
    <path d="M169 60 L125 90 L100 100 L115 75 Z" fill="url(#armGrad1)"/>
    <path d="M169 60 L125 90 L100 100 Z" fill="url(#facetHighlight)"/>
    
    <!-- Arm 4 (Bottom Left) -->
    <path d="M31 140 L75 110 L100 100 L85 125 Z" fill="url(#armGrad2)"/>
    <path d="M31 140 L75 110 L100 100 Z" fill="url(#facetHighlight)"/>
    
    <!-- Arm 5 (Bottom Right) -->
    <path d="M169 140 L115 125 L100 100 L125 110 Z" fill="url(#armGrad1)"/>
    <path d="M169 140 L115 125 L100 100 Z" fill="url(#facetHighlight)"/>
    
    <!-- Arm 6 (Top Left) -->
    <path d="M31 60 L85 75 L100 100 L75 90 Z" fill="url(#armGrad2)"/>
    <path d="M31 60 L85 75 L100 100 Z" fill="url(#facetHighlight)"/>
    
    <!-- Central Sphere / Core -->
    <circle cx="100" cy="100" r="16" fill="#FFFFFF"/>
    <circle cx="97" cy="97" r="12" fill="#E0F2FE"/>
    <circle cx="94" cy="94" r="5" fill="#FFFFFF"/>
  </g>
</svg>